[Itsm]
# 指向本地 Mock ITSM 服务(见 mock_itsm/),一键跑通全流程
name=support-agent
base_url=http://localhost:8000/itsm
index_url={base_url}/index
feed_url={base_url}/admin/bpmFeedBak/getBpmFeedBak?businessKey={business_key}&order=asc&_={time}
gro_url={base_url}/admin/Workindex/worklistGro?taskType=active&event=Gro&time={time}&page=1&limit={limit}
per_url={base_url}/admin/Workindex/worklistPer?taskType=active&event=Per&time={time}&page=1&limit={limit}
task_info_id_url={base_url}/admin/bpmProcess/viewTaskForm?taskInfoId={task_info_id}
get_file_list_url={base_url}/file/getFileList?businessKey={business_key}&order=asc&_={time}
view_business_info={base_url}/admin/bpmProcessView/viewBusinessInfo?businessKey={business_key}
# demo 账号(仅用于本地 Mock 服务,非真实凭据)
user=demo
pwd=demo123
